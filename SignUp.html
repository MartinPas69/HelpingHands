<!DOCTYPE html>
<html>
   <head>
       <title>Helping Hands Signup</title>
	   <link rel="stylesheet" href="design.css">
   </head>
   
    <body>
        <header>
	        <nav>
			    <h1>HELPING HANDS</h1><br>
				<h3>COMMUNITY ASSIST</h3>
				<ul class="nav-links">
				    <li><a href="#home" class="hover-effect">Home<a></li>
					<li><a href="href="#How It Works" class="hover-effect">How It Works</a></li>
					<li><a href="#About Us" class="hover-effect">About Us</a></li>
					<li><a href="#Contact Us" class="hover-effect">Contact Us</a></li>
					<li><a href="#Log In" class="hover-effect">Log In</a></li>
					
			</nav>
       </header>
	   
	   <main>
	       <h2>CREATE YOUR ACCOUNT</h2><br>
		   <p1>Sign up to get started with Helping Hands</p1>
	        <form>
		      <label for="fname">First Name:</label><br>
			  <input type="text" id="fname" name="fname" placeholder="Enter first name" required><br>
			  <label for="Lname">Last Name: Name:</label><br>
			  <input type="text" id="Lname" name="Lname" placeholder="Enter last name" required><br>
			  <label for="Email">Email Address:</label><br>
			  <input type="email" id="Email" name="Email" placeholder="Enter your email address" pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.(com|co\.za)$" required><br>
			  <label for="Num">Phone Number</label><br>
			  <input type="number" id="Num" name="Num" placeholder="Enter your phone number" required><br>
			  <label for="Password">Password</label><br>
			  <input type="password" id="Password" name="Password" placeholder="Create password" required><br>
			  <label for="cPassword">Confirm Password</label><br>
			  <input type="password" id="cPassword" name="cPassword" placeholder="Confirm password" required><br>
			  <label for="iam">I am a...</label><br>
			  <input type="text" id="iam" name="iam" placeholder:"Enter first name" placeholder="Select your role" required><br>
			  <label>
			  <input type="checkbox" id="terms" required>
			  I agree to the 
			  <a href=""> Terms & Conditions</a>
			  and 
			  <a href=""> Privacy Policies</a><br>
			  </label>
			  <input type="submit" value="Sign Up"><br>
			  <p>Already have an account? <a href="html file for login ">Log In</a></p>
			  
			  
		    </form>
	        
	    </main>
	   
	    <footer>
	        
	    </footer>
	   
	   
    </body>
</html>
